[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src

; ── ENVIRONMENT CONFIGURATION FOR ESP32-S3 DevKitC-1 ──
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ── FALLBACK CONFIGURATION FOR ESP32 DevKit V1 ──
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Required libraries (Auto-installed upon building)
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.4
  adafruit/DHT sensor library@^1.4.4
  adafruit/Adafruit Unified Sensor@^1.1.14